name: Check

on:
  pull_request:
  push:
    branches: [main]

# リポジトリを読むだけ
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 生成スクリプトのテスト
        run: python3 -m unittest discover -s scripts -v
      - name: 全アプリ・全 OS の生成と、README の対応表
        run: python3 scripts/generate_spec.py check
