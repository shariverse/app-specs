name: Sync

# main の仕様を各 OS のリポジトリの docs/spec/ に生成し、spec-sync ブランチの PR にする。
# 他のリポジトリに push するため、GITHUB_TOKEN ではなく GitHub App のトークンを使う。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  targets:
    # GitHub App を用意するまでは、失敗させずに飛ばす
    if: vars.SPEC_SYNC_APP_ID != ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "matrix=$(python3 scripts/generate_spec.py targets)" >> "$GITHUB_OUTPUT"

  sync:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-specs

      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SPEC_SYNC_APP_ID }}
          private-key: ${{ secrets.SPEC_SYNC_APP_PRIVATE_KEY }}
          owner: shariverse
          repositories: ${{ matrix.repository_name }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          token: ${{ steps.token.outputs.token }}
          path: target

      # 生成したものには元のコミットが入るので、そのまま比べると、どのコミットでも差分になる。
      # いまの docs/spec/ と同じコミットで生成し直して中身が同じなら、この OS には関係ない変更として触らない。
      # 触らなければ、下の create-pull-request は差分なしとして、開いている spec-sync の PR があれば閉じる。
      - name: docs/spec/ を生成
        env:
          APP: ${{ matrix.app }}
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ github.sha }}
        run: |
          generate() {
            python3 app-specs/scripts/generate_spec.py generate \
              --app "$APP" --platform "$PLATFORM" --out "$1" --source-commit "$2"
          }
          current=target/docs/spec
          if [ -f "$current/.source.json" ]; then
            commit=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["commit"])' "$current/.source.json")
            generate "$RUNNER_TEMP/unchanged" "$commit"
            if diff -r "$RUNNER_TEMP/unchanged" "$current" > /dev/null; then
              echo "$PLATFORM 版の仕様は変わっていないので、docs/spec/ を触りません"
              exit 0
            fi
          fi
          generate "$current" "$SHA"

      - uses: peter-evans/create-pull-request@v7
        with:
          path: target
          token: ${{ steps.token.outputs.token }}
          sign-commits: true
          branch: spec-sync
          delete-branch: true
          add-paths: docs/spec
          commit-message: "[docs] 仕様を app-specs に合わせる"
          title: "【DOCS】仕様を app-specs に合わせる"
          body: |
            [app-specs](https://github.com/shariverse/app-specs) の `${{ matrix.app }}` を ${{ matrix.platform }} 版として生成した `docs/spec/` です。

            - 元のコミット: https://github.com/shariverse/app-specs/commit/${{ github.sha }}
            - `docs/spec/` は直接編集しないでください。変えるときは app-specs に PR を出します

            仕様の変更を実装するときは、このブランチ（`spec-sync`）から作業ブランチを切り、実装と一緒にマージします。
            このブランチは app-specs が更新されるたびに作り直されるので、ここに直接コミットしないでください。
