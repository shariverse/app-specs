<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="title desc">
  <title id="title">app-specs の構成</title>
  <desc id="desc">app-specs に書いた方針と仕様を、generate_spec.py が iOS と Android のリポジトリの docs/spec/ に生成して配る。ロードマップ・提案・補足は配らない。</desc>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace; }
    .bg { fill: #FBF8F3; }
    .card { fill: #FFFFFF; }
    .ink { fill: #2B2A33; }
    .muted { fill: #6B6875; }
    .edge { stroke: #2B2A33; }
    .sal-s { stroke: #C2492A; } .sal-f { fill: #C2492A; } .sal-soft { fill: #FBE6DF; }
    .blue-s { stroke: #2F6FD6; } .blue-f { fill: #2459B8; } .blue-soft { fill: #E3ECFB; }
    .green-s { stroke: #1A7A50; } .green-f { fill: #1A7A50; } .green-soft { fill: #DDF1E7; }
    .grey-s { stroke: #9A96A0; } .grey-f { fill: #6B6875; } .grey-soft { fill: #F1EEE9; }
    .on-accent { fill: #FFFFFF; }
    .arrow { fill: none; stroke: #6B6875; stroke-width: 2; }
    .head { fill: #6B6875; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18171C; }
      .card { fill: #232129; }
      .ink { fill: #EEEAE4; }
      .muted { fill: #A9A5AF; }
      .edge { stroke: #EEEAE4; }
      .sal-s { stroke: #F08C70; } .sal-f { fill: #F08C70; } .sal-soft { fill: #3D2721; }
      .blue-s { stroke: #79A6F2; } .blue-f { fill: #79A6F2; } .blue-soft { fill: #1E2A3F; }
      .green-s { stroke: #5CC497; } .green-f { fill: #5CC497; } .green-soft { fill: #183027; }
      .grey-s { stroke: #7D7984; } .grey-f { fill: #A9A5AF; } .grey-soft { fill: #2A282F; }
      .on-accent { fill: #18171C; }
      .arrow { stroke: #A9A5AF; }
      .head { fill: #A9A5AF; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="548" rx="20"/>

  <text class="ink" x="32" y="46" font-size="21" font-weight="700">app-specs の構成</text>
  <text class="muted" x="32" y="72" font-size="13.5">仕様はここに書き、各 OS のリポジトリへ生成して配る</text>

  <!-- app-specs -->
  <rect class="card sal-s" x="32" y="96" width="400" height="392" rx="16" stroke-width="2"/>
  <text class="ink mono" x="54" y="131" font-size="15" font-weight="700">shariverse/app-specs</text>
  <rect class="sal-soft" x="330" y="113" width="80" height="26" rx="13"/>
  <text class="sal-f" x="370" y="131" font-size="12.5" font-weight="700" text-anchor="middle">仕様の正</text>

  <rect class="sal-soft" x="52" y="150" width="360" height="54" rx="10"/>
  <text class="ink mono" x="68" y="173" font-size="13.5" font-weight="700">shariverse.md</text>
  <text class="muted" x="68" y="193" font-size="12">Shariverse の方針（全アプリ共通）</text>
  <rect class="sal-f" x="334" y="166" width="64" height="22" rx="11"/>
  <text class="on-accent" x="366" y="181" font-size="11.5" font-weight="700" text-anchor="middle">配る</text>

  <rect class="sal-soft" x="52" y="214" width="360" height="54" rx="10"/>
  <text class="ink mono" x="68" y="237" font-size="13.5" font-weight="700">&lt;app&gt;/product.md</text>
  <text class="muted" x="68" y="257" font-size="12">アプリの方針（誰のため・何を守るか）</text>
  <rect class="sal-f" x="334" y="230" width="64" height="22" rx="11"/>
  <text class="on-accent" x="366" y="245" font-size="11.5" font-weight="700" text-anchor="middle">配る</text>

  <rect class="sal-soft" x="52" y="278" width="360" height="54" rx="10"/>
  <text class="ink mono" x="68" y="301" font-size="13.5" font-weight="700">features/ · rules.md · design/</text>
  <text class="muted" x="68" y="321" font-size="12">仕様（どう振る舞うか）</text>
  <rect class="sal-f" x="334" y="294" width="64" height="22" rx="11"/>
  <text class="on-accent" x="366" y="309" font-size="11.5" font-weight="700" text-anchor="middle">配る</text>

  <rect class="sal-soft" x="52" y="342" width="360" height="54" rx="10"/>
  <text class="ink mono" x="68" y="365" font-size="13.5" font-weight="700">platforms/ios.md · android.md</text>
  <text class="muted" x="68" y="385" font-size="12">OS ごとにわざと変えたこと</text>
  <rect class="sal-f" x="334" y="358" width="64" height="22" rx="11"/>
  <text class="on-accent" x="366" y="373" font-size="11.5" font-weight="700" text-anchor="middle">各 OS へ</text>

  <rect class="grey-soft grey-s" x="52" y="406" width="360" height="54" rx="10" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="ink mono" x="68" y="429" font-size="13" font-weight="700">roadmap.md · proposals/ · notes/</text>
  <text class="muted" x="68" y="449" font-size="12">次に作るもの・検討中の新機能・補足</text>
  <rect class="grey-f" x="334" y="422" width="64" height="22" rx="11"/>
  <text class="on-accent" x="366" y="437" font-size="11.5" font-weight="700" text-anchor="middle">配らない</text>

  <!-- 生成 -->
  <path class="arrow" d="M432 280 L456 280" marker-end="url(#arrow)"/>
  <rect class="card edge" x="462" y="236" width="156" height="88" rx="12" stroke-width="1.5"/>
  <text class="ink mono" x="540" y="268" font-size="13" font-weight="700" text-anchor="middle">generate_spec.py</text>
  <text class="muted" x="540" y="291" font-size="11.5" text-anchor="middle">main にマージすると</text>
  <text class="muted" x="540" y="308" font-size="11.5" text-anchor="middle">Sync が自動で動かす</text>
  <path class="arrow" d="M618 280 C 636 280, 630 186, 644 186" marker-end="url(#arrow)"/>
  <path class="arrow" d="M618 280 C 636 280, 630 398, 644 398" marker-end="url(#arrow)"/>

  <!-- iOS -->
  <rect class="card blue-s" x="650" y="96" width="278" height="180" rx="14" stroke-width="2"/>
  <rect class="blue-f" x="670" y="114" width="44" height="22" rx="11"/>
  <text class="on-accent" x="692" y="129" font-size="11.5" font-weight="700" text-anchor="middle">iOS</text>
  <text class="ink mono" x="724" y="130" font-size="11" font-weight="700">oshikatsu-countdown-ios</text>
  <text class="ink mono" x="670" y="166" font-size="14" font-weight="700">docs/spec/</text>
  <text class="ink" x="670" y="192" font-size="12.5">・共通の仕様 ＋ iOS の差分</text>
  <text class="ink" x="670" y="214" font-size="12.5">・platform.md（iOS 版だけの決定）</text>
  <rect class="blue-soft" x="670" y="234" width="168" height="24" rx="12"/>
  <text class="blue-f" x="754" y="250.5" font-size="12" font-weight="700" text-anchor="middle">spec-sync の PR で届く</text>

  <!-- Android -->
  <rect class="card green-s" x="650" y="308" width="278" height="180" rx="14" stroke-width="2"/>
  <rect class="green-f" x="670" y="326" width="64" height="22" rx="11"/>
  <text class="on-accent" x="702" y="341" font-size="11.5" font-weight="700" text-anchor="middle">Android</text>
  <text class="ink mono" x="742" y="342" font-size="11" font-weight="700">oshikatsu-countdown-android</text>
  <text class="ink mono" x="670" y="378" font-size="14" font-weight="700">docs/spec/</text>
  <text class="ink" x="670" y="404" font-size="12.5">・共通の仕様 ＋ Android の差分</text>
  <text class="ink" x="670" y="426" font-size="12.5">・platform.md（Android 版だけの決定）</text>
  <rect class="green-soft" x="670" y="446" width="168" height="24" rx="12"/>
  <text class="green-f" x="754" y="462.5" font-size="12" font-weight="700" text-anchor="middle">spec-sync の PR で届く</text>

  <text class="muted" x="32" y="524" font-size="12.5">docs/spec/ は直接編集しない。変えるときは app-specs に PR を出す（各 OS の Spec check が、手で直されていないかを確かめる）</text>
</svg>
