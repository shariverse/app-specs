<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="title desc">
  <title id="title">新しい機能の流れ</title>
  <desc id="desc">提案を proposals/ に書き、検討中として roadmap.md に載せる。作ると決めたら features/ に planned で書き、提案は消す。各 OS には spec-sync の PR で届き、実装したら status を shipped にする。</desc>
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace; }
    .bg { fill: #FBF8F3; }
    .card { fill: #FFFFFF; }
    .ink { fill: #2B2A33; }
    .muted { fill: #6B6875; }
    .sal-s { stroke: #C2492A; } .sal-f { fill: #C2492A; } .sal-soft { fill: #FBE6DF; }
    .grey-s { stroke: #9A96A0; } .grey-f { fill: #6B6875; } .grey-soft { fill: #F1EEE9; }
    .on-accent { fill: #FFFFFF; }
    .arrow { fill: none; stroke: #6B6875; stroke-width: 2; }
    .head { fill: #6B6875; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18171C; }
      .card { fill: #232129; }
      .ink { fill: #EEEAE4; }
      .muted { fill: #A9A5AF; }
      .sal-s { stroke: #F08C70; } .sal-f { fill: #F08C70; } .sal-soft { fill: #3D2721; }
      .grey-s { stroke: #7D7984; } .grey-f { fill: #A9A5AF; } .grey-soft { fill: #2A282F; }
      .on-accent { fill: #18171C; }
      .arrow { stroke: #A9A5AF; }
      .head { fill: #A9A5AF; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="336" rx="20"/>

  <text class="ink" x="32" y="46" font-size="21" font-weight="700">新しい機能の流れ</text>
  <text class="muted" x="32" y="72" font-size="13.5">提案から実装まで。決まっていないものは、各 OS に配らない</text>

  <!-- 1 -->
  <rect class="card grey-s" x="28" y="96" width="160" height="126" rx="14" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle class="grey-f" cx="52" cy="122" r="12"/>
  <text class="on-accent" x="52" y="126.5" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
  <text class="ink" x="72" y="127" font-size="15" font-weight="700">提案する</text>
  <text class="ink mono" x="44" y="160" font-size="11.5">proposals/*.md</text>
  <text class="muted" x="44" y="186" font-size="12">ひな形を写して書く</text>
  <text class="muted" x="44" y="205" font-size="12">PR の上で議論する</text>

  <path class="arrow" d="M190 159 L212 159" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect class="card grey-s" x="214" y="96" width="160" height="126" rx="14" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle class="grey-f" cx="238" cy="122" r="12"/>
  <text class="on-accent" x="238" y="126.5" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
  <text class="ink" x="258" y="127" font-size="15" font-weight="700">検討中に載せる</text>
  <text class="ink mono" x="230" y="160" font-size="11.5">roadmap.md</text>
  <text class="muted" x="230" y="186" font-size="12">マージしたら</text>
  <text class="muted" x="230" y="205" font-size="12">「検討中」に足す</text>

  <path class="arrow" d="M376 159 L398 159" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect class="card sal-s" x="400" y="96" width="160" height="126" rx="14" stroke-width="2"/>
  <circle class="sal-f" cx="424" cy="122" r="12"/>
  <text class="on-accent" x="424" y="126.5" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
  <text class="ink" x="444" y="127" font-size="15" font-weight="700">仕様にする</text>
  <text class="ink mono" x="416" y="160" font-size="11.5">features/ · planned</text>
  <text class="muted" x="416" y="186" font-size="12">作ると決めたら書き直し</text>
  <text class="muted" x="416" y="205" font-size="12">提案のファイルは消す</text>

  <path class="arrow" d="M562 159 L584 159" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <rect class="card sal-s" x="586" y="96" width="160" height="126" rx="14" stroke-width="2"/>
  <circle class="sal-f" cx="610" cy="122" r="12"/>
  <text class="on-accent" x="610" y="126.5" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
  <text class="ink" x="630" y="127" font-size="15" font-weight="700">各 OS に届く</text>
  <text class="ink mono" x="602" y="160" font-size="11.5">spec-sync の PR</text>
  <text class="muted" x="602" y="186" font-size="12">main にマージすると</text>
  <text class="muted" x="602" y="205" font-size="12">自動で作られる</text>

  <path class="arrow" d="M748 159 L770 159" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <rect class="card sal-s" x="772" y="96" width="160" height="126" rx="14" stroke-width="2"/>
  <circle class="sal-f" cx="796" cy="122" r="12"/>
  <text class="on-accent" x="796" y="126.5" font-size="12.5" font-weight="700" text-anchor="middle">5</text>
  <text class="ink" x="816" y="127" font-size="15" font-weight="700">実装する</text>
  <text class="ink mono" x="788" y="160" font-size="11.5">status: shipped</text>
  <text class="muted" x="788" y="186" font-size="12">spec-sync から切った</text>
  <text class="muted" x="788" y="205" font-size="12">ブランチで実装する</text>

  <!-- 帯 -->
  <rect class="grey-soft" x="28" y="236" width="346" height="30" rx="15"/>
  <text class="grey-f" x="201" y="256" font-size="12.5" font-weight="700" text-anchor="middle">app-specs の中だけ（配らない）</text>
  <rect class="sal-soft" x="400" y="236" width="532" height="30" rx="15"/>
  <text class="sal-f" x="666" y="256" font-size="12.5" font-weight="700" text-anchor="middle">各 OS の docs/spec/ に届く</text>

  <!-- 作らないとき -->
  <path class="arrow" d="M108 268 L108 292 L124 292" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
  <text class="muted" x="132" y="297" font-size="12.5">作らないと決めたら、product.md の「作らないもの」に足して、提案を消す</text>
</svg>
